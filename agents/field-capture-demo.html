<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FieldSnap</title>
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 760px; margin-inline: auto; line-height: 1.5; }
h1 { font-size: 1.4rem; margin-block-end: 0; } h2 { font-size: 1.1rem; }
label { display: block; margin-block: .65rem; } input, textarea { font: inherit; padding: .35rem; max-width: 100%; box-sizing: border-box; } textarea { display: block; width: min(100%, 480px); min-height: 4rem; }
button { cursor: pointer; padding: .4rem .75rem; border-radius: 4px; border: 1px solid #8886; background: transparent; font: inherit; }
button:hover { background: rgba(136,136,136,.15); } button:disabled { cursor: not-allowed; opacity: .6; }
.settings-panel { border: 1px solid #8886; border-radius: 6px; padding: .75rem 1rem; margin-block-end: 1rem; }
.settings-panel label { display: block; margin-block: .35rem; }.settings-note { font-size: .8rem; opacity: .7; margin: .35rem 0 0; }
.badge { display: inline-block; font-size: .75rem; padding: .1rem .5rem; border-radius: 999px; margin-inline-start: .5rem; background: rgba(136,136,136,.15); }
.notice, .model-error { font-size: .85rem; }.model-error { color: #c0392b; }.notice { border-left: 3px solid #8886; padding-inline-start: .75rem; }
video { display: block; width: min(100%, 480px); max-height: 360px; background: #111; border-radius: 6px; margin-block: 1rem; }
.capture { border: 1px solid #8886; border-radius: 6px; padding: 1rem; }.captured-doc { display: grid; grid-template-columns: 120px 1fr; gap: 1rem; border-top: 1px solid #8884; padding-block: 1rem; }
.captured-doc img { width: 120px; height: 90px; object-fit: cover; border-radius: 4px; background: #8883; }.status { color: #a66a00; font-weight: 600; }
.quick-types { display: flex; flex-wrap: wrap; gap: .4rem; margin-block: .75rem; }.quick-types button[aria-pressed="true"] { border-color: #2878b8; box-shadow: inset 0 0 0 1px #2878b8; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-block-start: .75rem; }.details { margin-block-start: .65rem; font-size: .9rem; }.details dl { margin: .35rem 0; }.details dt { font-weight: 600; }.details dd { margin-inline-start: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>FieldSnap</h1>
<p class="notice">Snap it. Save the proof.</p>
<p class="notice">Images stay in this browser on this device. Captures require human review; this page never uploads, posts, exports, files, or approves documents.</p>
<div id="settings"></div>
<p id="analysis-status" class="notice"></p>
<section class="capture">
  <label>Job / project <input id="job" autocomplete="off"></label>
  <label>Amount (optional) <input id="amount" inputmode="decimal" placeholder="Optional"></label>
  <label>Notes (optional) <textarea id="notes" placeholder="Optional context for a reviewer"></textarea></label>
  <div class="quick-types" aria-label="Optional snap type">
    <button type="button" data-snap-type="receipt" aria-pressed="false">Snap a Receipt</button>
    <button type="button" data-snap-type="invoice" aria-pressed="false">Snap an Invoice</button>
    <button type="button" data-snap-type="equipment_tag" aria-pressed="false">Snap an Equipment Tag</button>
    <button type="button" data-snap-type="job_progress" aria-pressed="false">Snap Job Progress</button>
    <button type="button" data-snap-type="safety_form" aria-pressed="false">Snap a Safety / Compliance Form</button>
  </div>
  <p id="type-status" class="notice">Snap type: unknown</p>
  <video id="camera" autoplay playsinline muted hidden></video>
  <p id="camera-status" class="notice">Requesting the rear camera…</p>
  <button id="capture-btn" type="button">Snap a Picture</button>
  <input id="file-input" type="file" accept="image/*" capture="environment" hidden>
  <p id="capture-error" class="model-error" role="alert"></p>
</section>
<section><h2>Recent Snaps</h2><div id="documents"><p>Loading on-device snaps…</p></div></section>

<script type="module">
import { loadSettings, loadModelPolicy, resolveModelConfig, renderSettingsPanel, renderModelError, renderResultBadge } from '../shared/model-client.js';

const DB_NAME = 'snapsuite_local';
const DB_VERSION = 2;
const SNAP_STORE = 'snaps';
const BLOB_STORE = 'snap_blobs';
const FIELD_QUEUE_KEY = 'field_docs_queue';
const BOOKS_QUEUE_KEY = 'books_review_queue';
let db; let stream = null; let objectUrls = []; let selectedSnapType = 'unknown';
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[c]);
function setError(message = '') { $('capture-error').textContent = message; }
function imageRef(id) { return `snapsuite_local://snap_blobs/${id}`; }

function openDb() { return new Promise((resolve, reject) => {
  if (!('indexedDB' in window)) return reject(new Error('IndexedDB is not supported by this browser.'));
  const request = indexedDB.open(DB_NAME, DB_VERSION);
  request.onupgradeneeded = () => {
    const database = request.result;
    if (!database.objectStoreNames.contains(SNAP_STORE)) database.createObjectStore(SNAP_STORE, { keyPath: 'id' });
    if (!database.objectStoreNames.contains(BLOB_STORE)) database.createObjectStore(BLOB_STORE, { keyPath: 'id' });
    if (!database.objectStoreNames.contains('approvals')) database.createObjectStore('approvals', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('shelf_profiles')) database.createObjectStore('shelf_profiles', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('shelf_snapshots')) database.createObjectStore('shelf_snapshots', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('shelf_snapshot_blobs')) database.createObjectStore('shelf_snapshot_blobs', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('product_catalog')) database.createObjectStore('product_catalog', { keyPath: 'sku' });
    if (!database.objectStoreNames.contains('reorder_proposals')) database.createObjectStore('reorder_proposals', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('shelf_notifications')) database.createObjectStore('shelf_notifications', { keyPath: 'id' });
    if (!database.objectStoreNames.contains('settings')) database.createObjectStore('settings', { keyPath: 'key' });
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(new Error('Could not open SnapSuite on-device storage.'));
}); }
function idbRequest(request) { return new Promise((resolve, reject) => { request.onsuccess = () => resolve(request.result); request.onerror = () => reject(new Error('IndexedDB operation failed.')); }); }
function complete(tx, message) { return new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onabort = tx.onerror = () => reject(new Error(message)); }); }
async function getSnaps() { const tx = db.transaction(SNAP_STORE, 'readonly'); return idbRequest(tx.objectStore(SNAP_STORE).getAll()); }
async function getBlob(id) { const tx = db.transaction(BLOB_STORE, 'readonly'); const entry = await idbRequest(tx.objectStore(BLOB_STORE).get(id)); return entry?.blob || null; }
async function saveSnap(snap, blob) {
  const tx = db.transaction([SNAP_STORE, BLOB_STORE], 'readwrite');
  tx.objectStore(BLOB_STORE).put({ id: snap.id, blob }); tx.objectStore(SNAP_STORE).put(snap);
  await complete(tx, 'Could not save the snap and original image to IndexedDB.');
}
async function updateSnap(snap) { const tx = db.transaction(SNAP_STORE, 'readwrite'); tx.objectStore(SNAP_STORE).put(snap); await complete(tx, 'Could not save optional GPS information.'); }
function readQueue(key) {
  const raw = localStorage.getItem(key); if (!raw) return [];
  try { const queue = JSON.parse(raw); if (!Array.isArray(queue)) throw new Error(); return queue; }
  catch { throw new Error(`The ${key} queue is malformed. It was left unchanged.`); }
}
function appendQueue(key, item) { const queue = readQueue(key); queue.push(item); localStorage.setItem(key, JSON.stringify(queue)); }
function requestGps() { return new Promise(resolve => {
  if (!navigator.geolocation) return resolve(null);
  navigator.geolocation.getCurrentPosition(p => resolve({ latitude: p.coords.latitude, longitude: p.coords.longitude, accuracy_m: p.coords.accuracy }), () => resolve(null), { enableHighAccuracy: false, timeout: 7000, maximumAge: 60000 });
}); }
function revokeObjectUrls() { objectUrls.forEach(URL.revokeObjectURL); objectUrls = []; }
function renderTypeSelection() {
  $('type-status').textContent = `Snap type: ${selectedSnapType}`;
  document.querySelectorAll('[data-snap-type]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.snapType === selectedSnapType)));
}
function detailsHtml(snap) {
  const gpsText = snap.gps ? `${snap.gps.latitude}, ${snap.gps.longitude} (accuracy ${snap.gps.accuracy_m}m)` : 'Unavailable';
  return `<div class="details" hidden data-details="${escapeHtml(snap.id)}"><dl><dt>Job / project</dt><dd>${escapeHtml(snap.job_hint)}</dd><dt>Amount</dt><dd>${escapeHtml(snap.amount_hint || '—')}</dd><dt>Notes</dt><dd>${escapeHtml(snap.notes || '—')}</dd><dt>Snap type</dt><dd>${escapeHtml(snap.snap_type)}</dd><dt>GPS</dt><dd>${escapeHtml(gpsText)}</dd><dt>Captured</dt><dd>${escapeHtml(snap.captured_at)}</dd><dt>Status</dt><dd>${escapeHtml(snap.status)}</dd></dl></div>`;
}
async function renderSnaps() {
  revokeObjectUrls(); const container = $('documents');
  let snaps; try { snaps = await getSnaps(); } catch (err) { container.innerHTML = `<p class="model-error">${escapeHtml(err.message)}</p>`; return; }
  snaps.sort((a, b) => b.captured_at.localeCompare(a.captured_at));
  if (!snaps.length) { container.innerHTML = '<p>No snaps yet.</p>'; return; }
  const rows = await Promise.all(snaps.map(async snap => {
    const blob = await getBlob(snap.id); const url = blob ? URL.createObjectURL(blob) : null; if (url) objectUrls.push(url);
    const image = url ? `<img src="${url}" alt="Captured snap for ${escapeHtml(snap.job_hint || 'an unspecified job')}">` : '<div class="notice">Original image unavailable.</div>';
    return `<article class="captured-doc">${image}<div><strong>${escapeHtml(snap.job_hint || 'No job specified')}</strong> <span class="status">${escapeHtml(snap.status)}</span><br><small>${escapeHtml(snap.captured_at)} · ${escapeHtml(snap.snap_type)} · ${escapeHtml(snap.original_filename)}${snap.amount_hint ? ` · Amount: ${escapeHtml(snap.amount_hint)}` : ''}</small><div class="actions"><button data-send="${escapeHtml(snap.id)}">Send to AccountingSnap</button><button data-details-toggle="${escapeHtml(snap.id)}" aria-expanded="false">View Details</button><button data-retake="${escapeHtml(snap.id)}">Retake / Capture Another</button></div>${detailsHtml(snap)}</div></article>`;
  }));
  container.innerHTML = rows.join('');
  container.querySelectorAll('img').forEach(img => img.addEventListener('error', () => { img.alt = 'Image preview unavailable'; img.removeAttribute('src'); }));
  container.querySelectorAll('[data-send]').forEach(button => button.addEventListener('click', () => handoff(button.dataset.send)));
  container.querySelectorAll('[data-details-toggle]').forEach(button => button.addEventListener('click', () => {
    const details = [...container.querySelectorAll('[data-details]')].find(item => item.dataset.details === button.dataset.detailsToggle);
    if (!details) return setError('Details for this snap are unavailable.');
    const opening = details.hidden; details.hidden = !opening; button.setAttribute('aria-expanded', String(opening)); button.textContent = opening ? 'Hide Details' : 'View Details';
  }));
  container.querySelectorAll('[data-retake]').forEach(button => button.addEventListener('click', resetForAnother));
}
async function handoff(id) {
  const tx = db.transaction(SNAP_STORE, 'readonly'); const snap = await idbRequest(tx.objectStore(SNAP_STORE).get(id));
  if (!snap) return setError('This snap is no longer available on this device.');
  try {
    const payload = { ...snap, job: snap.job_hint, timestamp: snap.captured_at, filename: snap.original_filename, source: 'fieldsnap' };
    const queue = readQueue(BOOKS_QUEUE_KEY);
    if (!queue.some(item => item && item.id === id)) { queue.push(payload); localStorage.setItem(BOOKS_QUEUE_KEY, JSON.stringify(queue)); }
    setError(''); alert('Sent to AccountingSnap as a needs_review item. No categorization or action was applied.');
  } catch (err) { setError(err.message); }
}
function resetForAnother() {
  $('job').value = ''; $('amount').value = ''; $('notes').value = ''; selectedSnapType = 'unknown'; renderTypeSelection(); setError('');
  if (!$('camera').hidden) $('camera').focus(); else $('file-input').click();
}
async function persistImage(blob, filename) {
  if (!blob || !blob.type.startsWith('image/')) return setError('Choose or capture a supported image file.');
  if (!window.crypto?.randomUUID) return setError('This browser does not support crypto.randomUUID(), which is required for capture IDs.');
  const id = window.crypto.randomUUID(); const capturedAt = new Date().toISOString();
  const snap = { id, image_ref: imageRef(id), source_app: 'fieldsnap', snap_type: selectedSnapType, captured_at: capturedAt, captured_by: 'local_user', job_hint: $('job').value.trim(), amount_hint: $('amount').value.trim() || '', notes: $('notes').value.trim() || '', gps: null, mime_type: blob.type, original_filename: filename || `${id}.jpg`, extracted_data: {}, proposed_filing: {}, status: 'needs_review', approval_history: [] };
  const gpsPromise = requestGps();
  try {
    await saveSnap(snap, blob);
    appendQueue(FIELD_QUEUE_KEY, { id, image_ref: snap.image_ref, job: snap.job_hint, amount_hint: snap.amount_hint, timestamp: snap.captured_at, status: 'needs_review' });
    setError(''); await renderSnaps();
  } catch (err) { setError(err.message); return; }
  gpsPromise.then(async location => { if (!location) return; try { snap.gps = location; await updateSnap(snap); await renderSnaps(); } catch (err) { setError(`${err.message} The snap and image were saved without GPS.`); } });
}
function snap() {
  if (!stream || $('camera').hidden || !$('camera').videoWidth) return $('file-input').click();
  const canvas = document.createElement('canvas'); canvas.width = $('camera').videoWidth; canvas.height = $('camera').videoHeight;
  canvas.getContext('2d').drawImage($('camera'), 0, 0); canvas.toBlob(blob => { if (blob) persistImage(blob, `fieldsnap-${Date.now()}.jpg`); else setError('Could not create an image from the camera.'); }, 'image/jpeg', .92);
}
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) { $('camera-status').textContent = 'Camera capture is unavailable here. Choose an image file instead.'; return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }); $('camera').srcObject = stream; $('camera').hidden = false; $('camera-status').textContent = 'Rear camera ready. If this is not the rear camera, use your device camera controls.'; }
  catch { $('camera-status').textContent = 'Camera permission was denied or unavailable. Choose an image file instead.'; }
}
async function init() {
  try { db = await openDb(); } catch (err) { setError(err.message); $('capture-btn').disabled = true; return; }
  try {
    const modelPolicy = await loadModelPolicy(); renderSettingsPanel($('settings'), modelPolicy);
    const settingsNote = $('settings').querySelector('.settings-note');
    if (settingsNote) settingsNote.textContent = 'Stored only in this browser\'s localStorage. Repo Defaults resolves this page\'s provider/model from config/model-policy.json.';
    const config = resolveModelConfig('books_review', modelPolicy, loadSettings());
    $('analysis-status').innerHTML = `${renderResultBadge(config)} <strong>Analysis unavailable:</strong> image analysis is disabled because this client-only page never uploads images or stores them remotely. A human must review every item.`;
  } catch (err) {
    renderModelError($('analysis-status'), err);
    $('analysis-status').append(' Image analysis cannot run.');
  }
  renderTypeSelection(); await renderSnaps(); startCamera();
}
document.querySelectorAll('[data-snap-type]').forEach(button => button.addEventListener('click', () => { selectedSnapType = button.dataset.snapType; renderTypeSelection(); }));
$('capture-btn').addEventListener('click', snap);
$('file-input').addEventListener('change', e => { const file = e.target.files?.[0]; if (file) persistImage(file, file.name); e.target.value = ''; });
window.addEventListener('beforeunload', () => { revokeObjectUrls(); stream?.getTracks().forEach(track => track.stop()); });
init();
</script>
</body>
</html>
