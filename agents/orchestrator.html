<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OfficeSnap · SnapSuite</title>
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; connect-src 'self' https://api.anthropic.com http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:*">
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; line-height: 1.5; }
h1 { font-size: 1.4rem; margin-block-end: 0.1rem; }
h2 { font-size: 1.1rem; }
.subtitle { margin-block-start: 0; opacity: .75; }
.tabs { margin-block-end: 1rem; }
.tabs button, .snap-paperwork { padding: 0.5rem 1rem; border: 1px solid #8886; background: transparent; cursor: pointer; font: inherit; border-radius: 4px; margin-inline-end: 0.5rem; }
.tabs button.active { background: rgba(136, 136, 136, 0.2); font-weight: 600; }
.snap-paperwork { margin-block-end: 1rem; font-weight: 600; }
.workspace { display: flex; gap: 1.5rem; }
.agent-panes { flex: 2; min-width: 0; }
.agent-frame { display: none; width: 100%; height: 720px; border: 1px solid #8886; border-radius: 6px; }
.agent-frame.active { display: block; }
aside#queue { flex: 1; border: 1px solid #8886; border-radius: 6px; padding: 1rem; max-height: 720px; overflow-y: auto; }
.queue-item { border-bottom: 1px solid #8884; padding-block: 0.75rem; }
.queue-item:last-child { border-bottom: none; }
.queue-agent-tag { text-transform: uppercase; font-size: 0.7rem; opacity: 0.6; letter-spacing: 0.05em; }
.badge { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; }
.badge-approved { background: #2ecc7133; color: #1e8449; }
.badge-rejected { background: #e74c3c33; color: #c0392b; }
.model-error { color: #c0392b; font-size: .85rem; }
.filter-bar { display: grid; gap: .5rem; margin-block: .75rem 1rem; }
.filter-bar label { font-size: .8rem; }
.filter-bar select { display: block; width: 100%; margin-block-start: .15rem; padding: .3rem; font: inherit; }
.field-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: .75rem; }
.field-thumb, .thumbnail-unavailable { width: 76px; height: 76px; border: 1px solid #8886; border-radius: 4px; object-fit: cover; }
.thumbnail-unavailable { display: grid; place-items: center; padding: .35rem; box-sizing: border-box; text-align: center; font-size: .7rem; opacity: .7; }
.field-row p { margin: .2rem 0 .45rem; }
details { margin-block-start: .45rem; }
details dl { margin: .5rem 0 0; }
details dt { font-weight: 600; }
details dd { margin: 0 0 .35rem; }
button { cursor: pointer; padding: 0.3rem 0.6rem; border-radius: 4px; border: 1px solid #8886; background: transparent; font: inherit; }
@media (max-width: 900px) { .workspace { flex-direction: column; } aside#queue { max-height: none; } }
</style>
</head>
<body>
<h1>OfficeSnap</h1>
<p class="subtitle">Paperwork in. Organized data out.</p>
<button class="snap-paperwork" id="snapPaperworkBtn">Snap Paperwork</button>
<div class="tabs">
  <button data-tab="payroll" class="active">Payroll</button>
  <button data-tab="books">Books</button>
  <button data-tab="contract">Contract</button>
  <button data-tab="fieldsnap">FieldSnap</button>
  <button data-tab="shelfsnap">ShelfSnap</button>
</div>
<div class="workspace">
  <div class="agent-panes">
    <iframe data-agent="payroll" src="payroll-review-demo.html" class="agent-frame active"></iframe>
    <iframe data-agent="books" src="books-review-demo.html" class="agent-frame"></iframe>
    <iframe data-agent="contract" src="contract-review-demo.html" class="agent-frame"></iframe>
    <iframe data-agent="fieldsnap" src="field-capture-demo.html" class="agent-frame"></iframe>
    <iframe data-agent="shelfsnap" src="shelf-snap-demo.html" class="agent-frame"></iframe>
  </div>
  <aside id="queue"></aside>
</div>
<script src="orchestrator.js"></script>
</body>
</html>
