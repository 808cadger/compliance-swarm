services:
  postgres:
    image: postgres:16
    container_name: compliance-swarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - compliance_swarm

  app:
    # Context is the repo root, not server/ — the image needs agents/, shared/, config/, and
    # templates/ (siblings of server/) baked in too, so ProcessPass's OfficeSnap/FieldSnap
    # "Start Process" links resolve without a bind mount (see server/Dockerfile). Compose
    # resolves a relative `context:` against this file's own directory (server/), so `..` is
    # the repo root; `dockerfile:` is then relative to that context.
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: compliance-swarm-app
    restart: unless-stopped
    depends_on:
      - postgres
    # NOT `env_file: .env`, which would also hand the app the Postgres superuser credentials
    # (POSTGRES_USER/POSTGRES_PASSWORD) and POSTGRES_APP_PASSWORD, defeating the restricted
    # compliance_swarm_app role's insert-only grant on audit_log. Compose still reads .env
    # for ${VAR} substitution below; it just no longer injects the whole file.
    environment:
      # `:-` (not `-`): substitutes `production` when NODE_ENV is unset OR empty. With a bare
      # ${NODE_ENV}, a .env missing the variable still injects NODE_ENV="" into the container,
      # and an `environment:` entry always overrides the image's own ENV — so the Dockerfile's
      # NODE_ENV=production default would be silently replaced by an empty string. config.js
      # reads `process.env.NODE_ENV ?? 'development'`, which `??` does not rescue from "",
      # leaving config.nodeEnv falsy and failing the `!== 'production'` checks that gate
      # error-detail disclosure — exactly the case the image default was meant to cover.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT}
      TZ: ${TZ}
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Both blank by default: config.js's own 'localhost'/http://localhost:<PORT> fallback is
      # wrong for any real deployment (see .env.example) but at least fails loudly (every
      # passkey ceremony rejects) rather than silently, so leaving these unset here rather than
      # inventing a production-looking default is deliberate — a real deployment must set them.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    volumes:
      - media_data:/data/media
    networks:
      - compliance_swarm

networks:
  compliance_swarm:
    driver: bridge

volumes:
  postgres_data:
  media_data:
