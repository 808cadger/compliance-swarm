services:
  postgres:
    image: postgres:16
    container_name: compliance-swarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - compliance_swarm

  app:
    build: .
    container_name: compliance-swarm-app
    restart: unless-stopped
    depends_on:
      - postgres
    # Only the five variables the spec's Deployment contract lists — NOT `env_file: .env`,
    # which would also hand the app the Postgres superuser credentials
    # (POSTGRES_USER/POSTGRES_PASSWORD) and POSTGRES_APP_PASSWORD, defeating the restricted
    # compliance_swarm_app role's insert-only grant on audit_log. Compose still reads .env
    # for ${VAR} substitution below; it just no longer injects the whole file.
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      TZ: ${TZ}
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    networks:
      - compliance_swarm

networks:
  compliance_swarm:
    driver: bridge

volumes:
  postgres_data:
