<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner — Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; color: #1a2b20; }
  h1 { color: #1a5f38; }
  fieldset { border: 1px solid #d8ded9; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(26,95,56,0.06); }
  legend { font-weight: 600; color: #1a5f38; padding: 0 0.4rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.9rem; }
  input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; font-size: 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 0.6rem 1rem; margin-top: 0.75rem; font-size: 1rem; background: #1a5f38; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #144a2c; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; }
  th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  .msg { padding: 0.5rem 0.75rem; border-radius: 6px; margin-top: 0.75rem; font-size: 0.9rem; }
  .msg.ok { background: #e6f4ea; color: #1e4620; }
  .msg.err { background: #fdecea; color: #7a271a; }
  nav { margin-bottom: 1rem; font-size: 0.9rem; }
  nav a { color: #1a5f38; margin-right: 1rem; }
  #receiptList { list-style: none; padding: 0; margin-top: 0.75rem; }
  #receiptList li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  #receiptList img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
  #receiptList button { margin-left: auto; padding: 0.3rem 0.6rem; font-size: 0.85rem; background: #7a271a; }
  #receiptList button:hover { background: #5c1d13; }
</style>
</head>
<body>
  <nav><a href="/processpass/decision">← My Processes</a><a href="/dashboard/audit">Audit Trail</a><a href="/dashboard/process-access">Process Access</a><a href="/dashboard/passkeys">Passkeys</a></nav>
  <h1>Owner / Admin</h1>

  <fieldset>
    <legend>Add a Site</legend>
    <form id="site-form">
      <label>Site name
        <input type="text" name="name" id="siteNameInput" required>
      </label>
      <button type="submit">Add Site</button>
    </form>
    <div id="siteMsg"></div>
  </fieldset>

  <fieldset>
    <legend>Add an Employee</legend>
    <form id="employee-form">
      <label>Name
        <input type="text" name="displayName" id="empNameInput" required>
      </label>
      <label>Email
        <input type="email" name="email" id="empEmailInput" required>
      </label>
      <label>Temporary password
        <input type="text" name="tempPassword" id="empPasswordInput" minlength="12" required>
      </label>
      <label>Role
        <select name="role" id="empRoleSelect" required>
          <option value="supervisor">Supervisor</option>
          <option value="accounting">Accounting</option>
        </select>
      </label>
      <button type="submit">Add Employee</button>
    </form>
    <div id="employeeMsg"></div>
  </fieldset>

  <fieldset>
    <legend>Assign a Walkthrough</legend>
    <form id="assign-form">
      <label>Supervisor
        <select name="supervisorId" id="supervisorSelect" required></select>
      </label>
      <label>Site
        <select name="siteId" id="siteSelect" required></select>
      </label>
      <label>Slot
        <select name="slot" id="slotSelect" required>
          <option value="morning">Morning</option>
          <option value="afternoon">Afternoon</option>
        </select>
      </label>
      <label>Date
        <input type="date" name="assignedDate" id="dateInput" required>
      </label>
      <button type="submit">Assign</button>
    </form>
    <div id="assignMsg"></div>
  </fieldset>

  <fieldset>
    <legend>Today's Assignments</legend>
    <table>
      <thead><tr><th>Site</th><th>Supervisor</th><th>Slot</th></tr></thead>
      <tbody id="assignmentsBody"></tbody>
    </table>
  </fieldset>

  <fieldset>
    <legend>File a Receipt or Invoice</legend>
    <form id="capture-form">
      <label>Type
        <select name="kind" id="kindSelect" required>
          <option value="receipt">Receipt</option>
          <option value="invoice">Invoice</option>
        </select>
      </label>
      <label>Photo
        <input type="file" accept="image/*" capture="environment" id="fileInput" required>
      </label>
      <button type="submit">File it</button>
    </form>
    <div id="captureMsg"></div>
  </fieldset>

  <fieldset>
    <legend>Filed Receipts &amp; Invoices</legend>
    <ul id="receiptList"></ul>
  </fieldset>

  <form onsubmit="event.preventDefault(); fetch('/api/auth/logout', {method:'POST'}).then(() => location.href='/login');">
    <button type="submit">Log out</button>
  </form>

  <script>
    function todayLocalDate() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    async function loadSupervisors() {
      const res = await fetch('/api/users');
      if (!res.ok) return;
      const users = await res.json();
      const select = document.getElementById('supervisorSelect');
      select.innerHTML = '';
      for (const user of users) {
        if (user.role !== 'supervisor' || user.disabledAt) continue;
        const opt = document.createElement('option');
        opt.value = user.id;
        opt.textContent = user.displayName;
        select.appendChild(opt);
      }
    }

    async function loadSites() {
      const res = await fetch('/api/sites');
      if (!res.ok) return;
      const sites = await res.json();
      const select = document.getElementById('siteSelect');
      select.innerHTML = '';
      for (const site of sites) {
        const opt = document.createElement('option');
        opt.value = site.id;
        opt.textContent = site.name;
        select.appendChild(opt);
      }
    }

    async function loadTodaysAssignments() {
      const res = await fetch('/api/assignments');
      if (!res.ok) return;
      const rows = await res.json();
      const tbody = document.getElementById('assignmentsBody');
      tbody.innerHTML = '';
      for (const a of rows) {
        const tr = document.createElement('tr');
        const siteTd = document.createElement('td');
        siteTd.textContent = a.siteName;
        const supTd = document.createElement('td');
        supTd.textContent = a.supervisorName;
        const slotTd = document.createElement('td');
        slotTd.textContent = a.slot;
        tr.append(siteTd, supTd, slotTd);
        tbody.appendChild(tr);
      }
    }

    async function loadReceipts() {
      const res = await fetch('/api/receipts');
      if (!res.ok) return;
      const rows = await res.json();
      const list = document.getElementById('receiptList');
      list.innerHTML = '';
      for (const r of rows) {
        const li = document.createElement('li');
        const img = document.createElement('img');
        img.src = `/api/receipts/${r.id}`;
        img.alt = r.kind;
        const label = document.createElement('span');
        label.textContent = `${r.kind} — ${r.uploadedByName}`;
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.addEventListener('click', () => deleteReceipt(r.id));
        li.append(img, label, del);
        list.appendChild(li);
      }
    }

    // ProcessPass demo sessions require a step-up confirmation before this action completes
    // (see requireStepUp in server/src/routes/receipts.js); a real password-authenticated
    // owner_admin user never sees this prompt — the DELETE just succeeds on the first try.
    async function deleteReceipt(id) {
      const res = await fetch(`/api/receipts/${id}`, { method: 'DELETE' });
      if (res.ok) { loadReceipts(); return; }
      const body = await res.json().catch(() => ({}));
      if (body?.error?.code !== 'step_up_required') { loadReceipts(); return; }
      const hint = sessionStorage.getItem('pp:stepUpPin');
      const promptText = hint
        ? `Additional verification required to delete filed evidence.\nEnter your one-time code (${hint}):`
        : 'Additional verification required to delete filed evidence.\nEnter your one-time code (check the ProcessPass My Processes screen):';
      const pin = prompt(promptText);
      if (!pin) return;
      const stepUp = await fetch('/api/processpass/step-up', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }),
      });
      if (!stepUp.ok) { alert('Incorrect PIN.'); return; }
      await fetch(`/api/receipts/${id}`, { method: 'DELETE' });
      loadReceipts();
    }

    document.getElementById('dateInput').value = todayLocalDate();
    loadSupervisors();
    loadSites();
    loadTodaysAssignments();
    loadReceipts();

    document.getElementById('site-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('siteNameInput').value;
      const res = await fetch('/api/sites', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const msg = document.getElementById('siteMsg');
      if (res.ok) {
        msg.textContent = 'Site added.';
        msg.className = 'msg ok';
        document.getElementById('siteNameInput').value = '';
        loadSites();
      } else {
        msg.textContent = 'Could not add that site.';
        msg.className = 'msg err';
      }
    });

    document.getElementById('employee-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const displayName = document.getElementById('empNameInput').value;
      const email = document.getElementById('empEmailInput').value;
      const tempPassword = document.getElementById('empPasswordInput').value;
      const role = document.getElementById('empRoleSelect').value;
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ displayName, email, tempPassword, role }),
      });
      const msg = document.getElementById('employeeMsg');
      if (res.ok) {
        msg.textContent = 'Employee added.';
        msg.className = 'msg ok';
        document.getElementById('employee-form').reset();
        loadSupervisors();
      } else {
        msg.textContent = 'Could not add that employee — check the fields.';
        msg.className = 'msg err';
      }
    });

    document.getElementById('assign-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const res = await fetch('/api/assignments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          supervisorId: form.get('supervisorId'),
          siteId: form.get('siteId'),
          slot: form.get('slot'),
          assignedDate: form.get('assignedDate'),
        }),
      });
      const msg = document.getElementById('assignMsg');
      if (res.ok) {
        msg.textContent = 'Assigned.';
        msg.className = 'msg ok';
        loadTodaysAssignments();
      } else {
        msg.textContent = 'Could not assign — check the fields.';
        msg.className = 'msg err';
      }
    });

    document.getElementById('capture-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const kind = document.getElementById('kindSelect').value;
      const file = document.getElementById('fileInput').files[0];
      const msg = document.getElementById('captureMsg');
      if (!file) return;

      const body = new FormData();
      body.append('kind', kind);
      body.append('file', file);
      const res = await fetch('/api/receipts', { method: 'POST', body });
      if (res.ok) {
        msg.textContent = 'Filed.';
        msg.className = 'msg ok';
        document.getElementById('fileInput').value = '';
        loadReceipts();
      } else {
        msg.textContent = 'Could not file it — check the file.';
        msg.className = 'msg err';
      }
    });
  </script>
</body>
</html>
