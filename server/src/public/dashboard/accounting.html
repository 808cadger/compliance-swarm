<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounting — Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; color: #1a2b20; }
  h1 { color: #1a5f38; }
  fieldset { border: 1px solid #d8ded9; border-radius: 8px; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(26,95,56,0.06); }
  legend { font-weight: 600; color: #1a5f38; padding: 0 0.4rem; }
  label { display: block; margin-top: 0.6rem; font-size: 0.9rem; }
  input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; font-size: 1rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 0.6rem 1rem; margin-top: 0.75rem; font-size: 1rem; background: #1a5f38; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #144a2c; }
  #receiptList { list-style: none; padding: 0; margin-top: 0.75rem; }
  #receiptList li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  #receiptList img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
  #receiptList button { margin-left: auto; padding: 0.3rem 0.6rem; font-size: 0.85rem; background: #7a271a; }
  #receiptList button:hover { background: #5c1d13; }
  .msg { padding: 0.5rem 0.75rem; border-radius: 6px; margin-top: 0.75rem; font-size: 0.9rem; }
  .msg.ok { background: #e6f4ea; color: #1e4620; }
  .msg.err { background: #fdecea; color: #7a271a; }
  nav { margin-bottom: 1rem; font-size: 0.9rem; }
  nav a { color: #1a5f38; }
</style>
</head>
<body>
  <nav><a href="/processpass/decision">← My Processes</a><a href="/dashboard/passkeys">Passkeys</a></nav>
  <h1>AccountingSnap</h1>

  <fieldset>
    <legend>File a Receipt or Invoice</legend>
    <form id="capture-form">
      <label>Type
        <select name="kind" id="kindSelect" required>
          <option value="receipt">Receipt</option>
          <option value="invoice">Invoice</option>
        </select>
      </label>
      <label>Photo
        <input type="file" accept="image/*" capture="environment" id="fileInput" required>
      </label>
      <button type="submit">File it</button>
    </form>
    <div id="captureMsg"></div>
  </fieldset>

  <fieldset>
    <legend>Filed Receipts &amp; Invoices</legend>
    <ul id="receiptList"></ul>
  </fieldset>

  <form onsubmit="event.preventDefault(); fetch('/api/auth/logout', {method:'POST'}).then(() => location.href='/login');">
    <button type="submit">Log out</button>
  </form>

  <script>
    async function loadReceipts() {
      const res = await fetch('/api/receipts');
      if (!res.ok) return;
      const rows = await res.json();
      const list = document.getElementById('receiptList');
      list.innerHTML = '';
      for (const r of rows) {
        const li = document.createElement('li');
        const img = document.createElement('img');
        img.src = `/api/receipts/${r.id}`;
        img.alt = r.kind;
        const label = document.createElement('span');
        label.textContent = `${r.kind} — ${r.uploadedByName}`;
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.addEventListener('click', () => deleteReceipt(r.id));
        li.append(img, label, del);
        list.appendChild(li);
      }
    }

    // ProcessPass demo sessions require a step-up confirmation before this action completes
    // (see requireStepUp in server/src/routes/receipts.js); a real password-authenticated
    // accounting user never sees this prompt — the DELETE just succeeds on the first try.
    async function deleteReceipt(id) {
      const res = await fetch(`/api/receipts/${id}`, { method: 'DELETE' });
      if (res.ok) { loadReceipts(); return; }
      const body = await res.json().catch(() => ({}));
      if (body?.error?.code !== 'step_up_required') { loadReceipts(); return; }
      const hint = sessionStorage.getItem('pp:stepUpPin');
      const promptText = hint
        ? `Additional verification required to delete filed evidence.\nEnter your one-time code (${hint}):`
        : 'Additional verification required to delete filed evidence.\nEnter your one-time code (check the ProcessPass My Processes screen):';
      const pin = prompt(promptText);
      if (!pin) return;
      const stepUp = await fetch('/api/processpass/step-up', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }),
      });
      if (!stepUp.ok) { alert('Incorrect PIN.'); return; }
      await fetch(`/api/receipts/${id}`, { method: 'DELETE' });
      loadReceipts();
    }

    loadReceipts();

    document.getElementById('capture-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const kind = document.getElementById('kindSelect').value;
      const file = document.getElementById('fileInput').files[0];
      const msg = document.getElementById('captureMsg');
      if (!file) return;

      const body = new FormData();
      body.append('kind', kind);
      body.append('file', file);
      const res = await fetch('/api/receipts', { method: 'POST', body });
      if (res.ok) {
        msg.textContent = 'Filed.';
        msg.className = 'msg ok';
        document.getElementById('fileInput').value = '';
        loadReceipts();
      } else {
        msg.textContent = 'Could not file it — check the file.';
        msg.className = 'msg err';
      }
    });
  </script>
</body>
</html>
