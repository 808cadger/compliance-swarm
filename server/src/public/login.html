<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Swarm — Log In</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self'">
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 15vh auto; padding: 0 1rem; }
  input, button { width: 100%; padding: 0.6rem; margin-top: 0.5rem; font-size: 1rem; }
  button { background: #1a5f38; color: white; border: none; border-radius: 4px; }
  button.secondary { background: transparent; color: #1a5f38; border: 1px solid #ccc; }
  #error, #passkeyError { color: #b00020; min-height: 1.2rem; margin-top: 0.5rem; }
  .divider { text-align: center; color: #999; font-size: 0.85rem; margin: 1.25rem 0; }
</style>
</head>
<body>
  <h1>Compliance Swarm</h1>
  <form id="login-form">
    <input type="email" name="email" placeholder="Email" required autocomplete="username">
    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Log In</button>
    <div id="error"></div>
  </form>

  <div class="divider">or</div>
  <button id="passkeyBtn" class="secondary" type="button">Sign in with a passkey</button>
  <div id="passkeyError"></div>

  <p style="text-align:center; margin-top:1rem; font-size:0.9rem;">
    <a href="/processpass" style="color:#1a5f38;">Use ProcessPass instead →</a>
  </p>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
